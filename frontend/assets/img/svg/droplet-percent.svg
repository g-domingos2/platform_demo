<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
  <!-- Sonda de umidade do solo: gota com a base preenchida (nível de água)
       e o símbolo de porcentagem acima da linha d'água. Traço flat, pra
       ler bem em 18px e herdar a cor do contexto via currentColor. -->
  <defs>
    <clipPath id="cf-drop-clip">
      <path d="M12 2.6 C12 2.6 5.4 9.7 5.4 14.2 a6.6 6.6 0 0 0 13.2 0 C18.6 9.7 12 2.6 12 2.6 Z"/>
    </clipPath>
  </defs>

  <!-- Nível de água: recortado pela silhueta da gota -->
  <rect x="4" y="16.6" width="16" height="7" fill="currentColor" stroke="none" clip-path="url(#cf-drop-clip)"/>

  <!-- Contorno da gota -->
  <path d="M12 2.6 C12 2.6 5.4 9.7 5.4 14.2 a6.6 6.6 0 0 0 13.2 0 C18.6 9.7 12 2.6 12 2.6 Z"/>

  <!-- Símbolo de porcentagem: traço mais fino que o contorno, senão os
       círculos empastelam nos tamanhos pequenos. -->
  <g stroke-width="1.2">
    <circle cx="10.2" cy="10.4" r="0.8"/>
    <circle cx="13.8" cy="14.2" r="0.8"/>
    <path d="M14.2 10 L9.8 14.6"/>
  </g>
</svg>
