<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recibo — Irricontrol</title>
  <style>
    :root {
      --green: #4caf50;
      --green-dark: #2f9e44;
      --ink: #1a1f36;
      --muted: #6b7280;
      --border: #e6e6e6;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #54b948;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--ink);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px;
    }

    .rcpt {
      width: 100%;
      max-width: 460px;
    }

    .rcpt__brand {
      display: block;
      height: 32px;
      margin-bottom: 22px;
    }

    .rcpt__card {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, .12), 0 5px 15px rgba(0, 0, 0, .06);
      padding: 36px 40px 32px;
    }

    .rcpt__icon {
      position: relative;
      width: 64px;
      margin: 0 auto 18px;
    }

    .rcpt__icon-doc {
      width: 64px;
      height: 64px;
      display: block;
    }

    .rcpt__icon-check {
      position: absolute;
      right: -4px;
      bottom: -2px;
      width: 26px;
      height: 26px;
      background: var(--green);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      border: 2px solid #fff;
    }

    .rcpt__status {
      text-align: center;
      font-size: 15px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .rcpt__amount {
      text-align: center;
      font-size: 34px;
      font-weight: 600;
      letter-spacing: -.5px;
      margin-bottom: 8px;
    }

    .rcpt__details-link {
      display: block;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      text-decoration: none;
      margin-bottom: 26px;
    }

    .rcpt__details-link:hover { color: var(--ink); }

    .rcpt__rows {
      border-top: 1px solid var(--border);
      padding-top: 18px;
      margin-bottom: 24px;
    }

    .rcpt__row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      padding: 7px 0;
    }

    .rcpt__row-label { color: var(--muted); }
    .rcpt__row-value { color: var(--ink); font-weight: 500; }

    .rcpt__actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .rcpt__btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 42px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all .15s ease;
    }

    .rcpt__btn--ghost {
      background: #fff;
      border: 1px solid var(--green);
      color: var(--green-dark);
    }

    .rcpt__btn--ghost:hover { background: #f4fbf4; }

    .rcpt__btn--primary {
      background: var(--green-dark);
      border: 1px solid var(--green-dark);
      color: #fff;
    }

    .rcpt__btn--primary:hover { background: #278a3a; }

    .rcpt__footer {
      text-align: center;
      margin-top: 26px;
      color: rgba(16, 50, 26, .75);
      font-size: 12px;
    }

    .rcpt__footer-powered { font-weight: 500; }
    .rcpt__footer-powered b { font-weight: 700; }

    .rcpt__footer-links {
      margin-top: 6px;
      display: flex;
      gap: 14px;
      justify-content: center;
    }

    .rcpt__footer-links a {
      color: rgba(16, 50, 26, .75);
      text-decoration: none;
      font-size: 12px;
    }

    .rcpt__footer-links a:hover { text-decoration: underline; }
  </style>
</head>

<body>
  <div class="rcpt">
    <img class="rcpt__brand" src="../assets/img/brand/irricontrol-logo.svg" alt="Irricontrol">

    <div class="rcpt__card">
      <div class="rcpt__icon">
        <svg class="rcpt__icon-doc" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M6 2h8l4 4v16H6V2z" fill="#e9edf2" />
          <path d="M14 2l4 4h-4V2z" fill="#cfd6df" />
          <rect x="8.5" y="9" width="7" height="1.4" rx="0.7" fill="#c2cad4" />
          <rect x="8.5" y="12" width="7" height="1.4" rx="0.7" fill="#c2cad4" />
          <rect x="8.5" y="15" width="4.5" height="1.4" rx="0.7" fill="#c2cad4" />
        </svg>
        <span class="rcpt__icon-check" id="rcptCheck">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12" /></svg>
        </span>
      </div>

      <div class="rcpt__status" id="rcptStatus">Fatura paga</div>
      <div class="rcpt__amount" id="rcptAmount">R$ 14.400,00</div>
      <a class="rcpt__details-link" href="#" id="rcptDetailsLink" target="_blank">Ver detalhes da fatura ›</a>

      <div class="rcpt__rows">
        <div class="rcpt__row">
          <span class="rcpt__row-label">Número da fatura</span>
          <span class="rcpt__row-value" id="rcptNumber">00000000-0002</span>
        </div>
        <div class="rcpt__row">
          <span class="rcpt__row-label" id="rcptDateLabel">Data de pagamento</span>
          <span class="rcpt__row-value" id="rcptDate">26 de novembro de 2024</span>
        </div>
        <div class="rcpt__row">
          <span class="rcpt__row-label">Forma de pagamento</span>
          <span class="rcpt__row-value" id="rcptMethod">Boleto</span>
        </div>
      </div>

      <div class="rcpt__actions">
        <a class="rcpt__btn rcpt__btn--ghost" href="#" id="rcptBtn1" target="_blank">Baixar fatura</a>
        <a class="rcpt__btn rcpt__btn--primary" href="#" id="rcptBtn2">Baixar recibo</a>
      </div>
    </div>

    <div class="rcpt__footer">
      <div class="rcpt__footer-powered">Powered by <b>stripe</b></div>
      <div class="rcpt__footer-links">
        <a href="#">Termos</a>
        <a href="#">Privacidade</a>
      </div>
    </div>
  </div>

  <script src="../assets/js/i18n/core.js"></script>
  <script src="../assets/js/i18n/dict.js"></script>
  <script src="../assets/js/i18n/dict.es.js"></script>
  <script>
    // Dados fake vindos por query string (?status=&amount=&number=&date=&method=).
    // Em produção esta tela é a hosted invoice/receipt do próprio Stripe.
    (function () {
      var q = new URLSearchParams(location.search);
      function set(id, v) { if (v != null && v !== '') document.getElementById(id).textContent = v; }

      set('rcptAmount', q.get('amount'));
      set('rcptNumber', q.get('number'));
      set('rcptDate', q.get('date'));
      set('rcptMethod', q.get('method'));

      // Repassa os mesmos dados da fatura para a tela de detalhes (PDF).
      var detailsParams = new URLSearchParams();
      ['amount', 'number', 'date', 'method', 'status'].forEach(function (key) {
        if (q.get(key)) detailsParams.set(key, q.get(key));
      });
      document.getElementById('rcptDetailsLink').href = './fatura-detalhes.html?' + detailsParams.toString();

      // Só fatura paga pode ser baixada (abre o modelo em PDF direto no diálogo de impressão).
      var dlBtn = document.getElementById('rcptBtn1');
      if (q.get('status') === 'paid' || !q.get('status')) {
        detailsParams.set('download', '1');
        dlBtn.href = './fatura-detalhes.html?' + detailsParams.toString();
      } else {
        dlBtn.style.display = 'none';
      }

      var ICON = {
        check: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
        clock: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg>',
        alert: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="8" x2="12" y2="13"/><line x1="12" y1="17" x2="12" y2="17"/></svg>'
      };

      var MAP = {
        paid:    { label: 'Fatura paga',           color: '#4caf50', icon: 'check', dateLabel: 'Data de pagamento', btn: 'Baixar recibo' },
        pending: { label: 'Aguardando pagamento',  color: '#f59e0b', icon: 'clock', dateLabel: 'Vencimento',        btn: 'Pagar boleto' },
        overdue: { label: 'Fatura vencida',        color: '#ff4d4f', icon: 'alert', dateLabel: 'Vencimento',        btn: 'Pagar 2ª via' }
      };

      var s = MAP[q.get('status')] || MAP.paid;
      document.getElementById('rcptStatus').textContent = s.label;
      document.getElementById('rcptDateLabel').textContent = s.dateLabel;
      document.getElementById('rcptBtn2').textContent = s.btn;

      var check = document.getElementById('rcptCheck');
      check.style.background = s.color;
      check.innerHTML = ICON[s.icon];
    })();
  </script>
</body>

</html>
