<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Irricontrol</title>
  <link rel="icon" type="image/png" href="./frontend/assets/img/favicon/cat.png" />
  <script>
    (function () {
      var isGithubPages = /github\.io$/i.test(window.location.hostname);
      var parts = window.location.pathname.split("/").filter(Boolean);
      var base = isGithubPages && parts.length ? "/" + parts[0] : "";
      window.location.replace(base + "/frontend/");
    })();
  </script>
</head>
<body>
  <p>Pagina nao encontrada. Abrindo Irricontrol...</p>
</body>
</html>
